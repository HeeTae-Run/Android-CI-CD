name: Android CI (Build & Test)

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 푸시될 때만 실행
  pull_request:
    branches: [ "develop" ] # (옵션) develop으로 향하는 PR에서도 실행되면 좋습니다

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 내려받기
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. JDK 17 설정 (최신 안드로이드 프로젝트 표준)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Gradle 의존성 자동 캐싱 (빌드 속도 향상)

      # 3. Gradle 실행 권한 부여 (리눅스 환경 필수)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Lint 검사 (코드 스타일 및 잠재적 오류 확인 - 선택 사항)
      # - name: Run Lint
      #   run: ./gradlew lintDebug

      # 5. 유닛 테스트 실행 (실패 시 여기서 파이프라인 중단됨)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 6. Debug APK 빌드 (서명 설정 불필요)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. 현재 날짜 가져오기 및 APK 파일명 변경
      - name: Rename APK with Date
        run: |
          # 1) 현재 날짜를 YYYY-MM-DD 형식으로 변수(DATE)에 저장
          DATE=$(date +%Y-%m-%d)
          
          # 2) 파일명을 변경 (app-debug.apk -> app-dev-2026-01-29.apk)
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-dev-$DATE.apk
          
          # 3) 다음 단계(Upload)에서 쓸 수 있게 환경변수(NEW_APK_NAME)로 등록
          echo "NEW_APK_NAME=app-dev-$DATE.apk" >> $GITHUB_ENV

      # 8. 변경된 파일명으로 업로드
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NEW_APK_NAME }}  # Artifact(압축파일) 이름도 날짜로 설정
          path: app/build/outputs/apk/debug/${{ env.NEW_APK_NAME }} # 변경된 파일 경로 업로드
          retention-days: 1

      # 9. Firebase 인증 키 파일 생성 (GitHub Secret에서 꺼내오기)
      - name: Create Firebase Service Credentials file
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_CREDENTIAL }}
        run: |
          echo "$FIREBASE_CREDENTIAL" > app/firebase-auth.json

      # 10. Firebase App Distribution 배포
      - name: Upload to Firebase App Distribution
        run: ./gradlew appDistributionUploadDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"