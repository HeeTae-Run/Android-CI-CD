name: Android CI (Build & Test)

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 푸시될 때만 실행
  pull_request:
    branches: [ "develop" ] # (옵션) develop으로 향하는 PR에서도 실행되면 좋습니다

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 내려받기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 설정 (최신 안드로이드 프로젝트 표준)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Gradle 의존성 자동 캐싱 (빌드 속도 향상)

      # 3. Gradle 실행 권한 부여 (리눅스 환경 필수)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Lint 검사 (코드 스타일 및 잠재적 오류 확인 - 선택 사항)
      # - name: Run Lint
      #   run: ./gradlew lintDebug

      # 5. 유닛 테스트 실행 (실패 시 여기서 파이프라인 중단됨)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 6. Debug APK 빌드 (서명 설정 불필요)
      - name: Build Debug APK
        run: ./gradlew assembleDebug