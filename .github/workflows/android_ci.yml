name: Android CI (Build & Test)

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 푸시될 때만 실행
  pull_request:
    branches: [ "develop" ] # (옵션) develop으로 향하는 PR에서도 실행되면 좋습니다

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 내려받기 (커밋 히스토리 전체 포함)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. JDK 17 설정 (최신 안드로이드 프로젝트 표준)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Gradle 의존성 자동 캐싱

      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Lint 검사 (선택 사항 - 현재 주석 처리됨)
      # - name: Run Lint
      #   run: ./gradlew lintDebug

      # 5. 유닛 테스트 실행
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 6. Debug APK 빌드
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. 현재 날짜 가져오기 및 Debug APK 파일명 변경
      - name: Rename APK with Date
        run: |
          DATE=$(date +%Y-%m-%d)
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-dev-$DATE.apk
          echo "NEW_APK_NAME=app-dev-$DATE.apk" >> $GITHUB_ENV

      # 8. 변경된 Debug APK 업로드 (GitHub Artifact)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NEW_APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.NEW_APK_NAME }}
          retention-days: 1

      # 9. Firebase 인증 키 파일 생성
      - name: Create Firebase Service Credentials file
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_CREDENTIAL }}
        run: |
          echo "$FIREBASE_CREDENTIAL" > app/firebase-auth.json

      # 10. Firebase App Distribution 배포 (Debug 버전)
      - name: Upload to Firebase App Distribution
        run: ./gradlew appDistributionUploadDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"

      # 11. 키스토어 파일 복원 (Base64 -> 파일)
      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 --decode > app/keystore.jks

      # 12. Release APK 빌드 (서명 포함)
      - name: Build Release APK
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 13. Release APK 업로드 (GitHub Artifact)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3