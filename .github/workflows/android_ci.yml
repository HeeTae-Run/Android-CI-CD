name: Android CI (Build & Test)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: 테스트 및 검증 (PR, Push 모두 실행)
  # 목적: 빠르게 코드의 유효성을 검증한다.
  # -------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 캐시 효율을 위해 Unit Test만 수행 (Lint는 필요시 주석 해제)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  # -------------------------------------------------------------
  # Job 2: 배포 (Push 일 때만 실행 & Test 통과 시에만 실행)
  # 목적: 실제 아티팩트를 만들고 배포한다.
  # -------------------------------------------------------------
  deploy:
    needs: test # [중요] test Job이 성공해야만 실행됨 (의존성 설정)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' # [중요] PR에서는 실행 안 함
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------------------------------------------------------
      # Debug Build & Firebase
      # ---------------------------------------------------------
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with Date
        run: |
          DATE=$(date +%Y-%m-%d)
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-dev-$DATE.apk
          echo "NEW_APK_NAME=app-dev-$DATE.apk" >> $GITHUB_ENV

      - name: Create Firebase Service Credentials file
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_CREDENTIAL }}
        run: |
          echo "$FIREBASE_CREDENTIAL" > app/firebase-auth.json

      - name: Upload to Firebase App Distribution
        run: ./gradlew appDistributionUploadDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"

      # ---------------------------------------------------------
      # Release Build
      # ---------------------------------------------------------
      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 --decode > app/keystore.jks

      - name: Build Release APK
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # ---------------------------------------------------------
      # Artifact Upload (Debug & Release)
      # ---------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NEW_APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.NEW_APK_NAME }}
          retention-days: 1

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3